[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cubesec-sim"
version = "0.2.0"
description = "Offline synthetic CubeSat link and tool-orchestration simulation artifact"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "João Paolo Cavalcante Martins Oliveira"}]
dependencies = ["numpy>=1.26,<3"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

[project.scripts]
cubesec-sim = "cubesec_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
