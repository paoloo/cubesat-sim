[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cubesec-sim"
version = "1.0.0"
description = "Integrated offline CubeSat mission, link and cybersecurity simulator"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "João Paolo Cavalcante Martins Oliveira"}]
dependencies = ["numpy>=1.26,<3", "cryptography>=42,<47"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
orbit = ["sgp4>=2.24,<3"]

[project.scripts]
cubesec-sim = "cubesec_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
